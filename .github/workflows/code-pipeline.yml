name: Coding Agents

# Thin caller: owns the triggers, delegates all logic to _code-pipeline.yml.
on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number (coder phase)"
        required: false
      pr_number:
        description: "PR number (reviewer phase)"
        required: false
      fix_round:
        description: "Coder phase: treat this run as a reviewer fix round (existing PR) rather than an initial implementation"
        required: false
        type: boolean
        default: false
      phase:
        description: "Which phase to run"
        required: true
        type: choice
        options:
          - coder
          - reviewer
      debug:
        description: "Show full Claude output in logs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/_code-pipeline.yml
    secrets: inherit
    with:
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      fix_round: ${{ github.event_name == 'workflow_dispatch' && inputs.fix_round || false }}
      phase: ${{ inputs.phase }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || false }}

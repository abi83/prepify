name: deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to redeploy to prod (rollback). Leave empty to deploy the current branch to dev instead."
        required: false
      run_tests:
        description: "Run tests before deploying"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Mirrors terraform/shared outputs — can't be wired automatically since
# Terraform hasn't run yet when this workflow starts. Keep in sync by hand.
#
# vars.GCP_PROJECT_ID is an environment-scoped Actions variable (repo
# Settings → Environments → dev / prod), not defined in this file — it
# resolves to prepify-dev-vk or prepify-prod based on each job's `environment:`.
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-deploy@prepify-infra.iam.gserviceaccount.com
  REGISTRY: us-central1-docker.pkg.dev/prepify-infra/prepify
  IMAGE: app
  REGION: us-central1

jobs:
  # Only workflow_dispatch's run_tests input can skip this.
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests != false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # Same skip switch as `test`. Kept a separate check so a green/red build
  # signal is distinct from tests — the coding pipeline gates the reviewer
  # on both (#134).
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests != false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  deploy-dev:
    needs: [test, build]
    if: |
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag == '')
      )
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: |
          DATABASE_URL_DIRECT="$(gcloud secrets versions access latest --secret=database-url-direct --project=${{ vars.GCP_PROJECT_ID }})"
          export DATABASE_URL_DIRECT
          npx prisma migrate deploy
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: prepify
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

  # Gated by the "prod" environment's required-reviewer rule (GitHub settings, not visible here).
  deploy-prod:
    needs: [test, build]
    if: |
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run database migrations
        run: |
          DATABASE_URL_DIRECT="$(gcloud secrets versions access latest --secret=database-url-direct --project=${{ vars.GCP_PROJECT_ID }})"
          export DATABASE_URL_DIRECT
          npx prisma migrate deploy
      - name: Resolve target version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        if: github.event_name != 'workflow_dispatch'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: prepify
          region: ${{ env.REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}

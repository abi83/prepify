name: deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to redeploy to prod (rollback) — must already be in Artifact Registry"
        required: true

permissions:
  contents: read
  id-token: write

# Mirrors terraform/shared outputs — can't be wired automatically since
# Terraform hasn't run yet when this workflow starts. Keep in sync by hand.
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-deploy@prepify-infra.iam.gserviceaccount.com
  REGISTRY: us-central1-docker.pkg.dev/prepify-infra/prepify
  IMAGE: app
  REGION: us-central1

jobs:
  # Every merge to main (including release-please's own release-PR merges)
  # deploys to dev, tagged by commit SHA — dev always tracks the tip of main.
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: prepify
          region: ${{ env.REGION }}
          project_id: prepify-dev-vk
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}

  # Deploys a released vX.Y.Z (never a SHA or `latest`), gated by the
  # "prod" environment's required-reviewer rule. workflow_dispatch
  # redeploys an existing tag for rollback, without rebuilding.
  deploy-prod:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve target version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push image
        if: github.event_name != 'workflow_dispatch'
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: prepify
          region: ${{ env.REGION }}
          project_id: prepify-prod
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.tag }}

name: terraform

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

# These duplicate terraform/shared/outputs.tf's github_actions_workload_identity_provider
# and github_actions_terraform_service_account — can't be wired automatically because
# the auth step below needs them before Terraform runs to produce those outputs. If
# terraform-ci or the WIF provider is ever renamed in terraform/shared/github_actions.tf,
# update both places by hand.
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: terraform-ci@prepify-infra.iam.gserviceaccount.com

jobs:
  # Scopes plan/apply to the roots actually touched, so a dev-only change
  # doesn't also plan/apply shared and prod for a guaranteed no-op. This
  # workflow deliberately has no `paths:` filter on pull_request/push (even
  # though only this job needs to run for non-terraform PRs) — plan-shared/
  # plan-dev/plan-prod are required status checks on main, and a required
  # check that never gets a check run (workflow never triggered) blocks
  # merging forever, unlike one that reports "skipped". Not meaningful for
  # workflow_dispatch (no base to diff against) — jobs treat a manual run
  # as "run me" regardless of these outputs.
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      dev: ${{ steps.filter.outputs.dev }}
      prod: ${{ steps.filter.outputs.prod }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'terraform/shared/**'
              - 'terraform/modules/apis/**'
            dev:
              - 'terraform/envs/dev/**'
              - 'terraform/modules/environment/**'
              - 'terraform/modules/apis/**'
            prod:
              - 'terraform/envs/prod/**'
              - 'terraform/modules/environment/**'
              - 'terraform/modules/apis/**'

  plan-shared:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          working_directory: terraform/shared
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Check formatting
        run: terraform fmt -check
      - name: Plan
        run: terraform plan -no-color

  plan-dev:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.dev == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        id: init
        with:
          working_directory: terraform/envs/dev
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          needs_neon_secret: "true"
      - name: Check formatting
        run: terraform fmt -check
      - name: Plan
        run: terraform plan -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.init.outputs.neon_api_key }}

  plan-prod:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.prod == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        id: init
        with:
          working_directory: terraform/envs/prod
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          needs_neon_secret: "true"
      - name: Check formatting
        run: terraform fmt -check
      - name: Plan
        run: terraform plan -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.init.outputs.neon_api_key }}

  # Shared infra (Artifact Registry, WIF, CI identities) auto-applies on
  # merge, same as dev — it changes rarely and isn't environment data-plane.
  apply-shared:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/shared
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        with:
          working_directory: terraform/shared
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Apply
        run: terraform apply -auto-approve -no-color

  # Dev auto-applies on merge — no gate, matches "dev is the thing you
  # break to find out" tier. The "dev" GitHub Environment has no protection
  # rules; it's here for deployment history/visibility, same as prod.
  #
  # needs.apply-shared.result may be "skipped" (shared untouched by this
  # push) rather than "success" — both are fine to proceed on, only
  # "failure"/"cancelled" should block dev.
  apply-dev:
    needs: [changes, apply-shared]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.dev == 'true' &&
      (needs.apply-shared.result == 'success' || needs.apply-shared.result == 'skipped')
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        id: init
        with:
          working_directory: terraform/envs/dev
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          needs_neon_secret: "true"
      - name: Apply
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.init.outputs.neon_api_key }}

  # Prod requires manual approval — see the "prod" GitHub Environment's
  # required-reviewer protection rule (repo Settings > Environments). Same
  # skip-tolerant needs.apply-shared.result check as apply-dev above.
  apply-prod:
    needs: [changes, apply-shared]
    if: |
      github.event_name == 'push' &&
      needs.changes.outputs.prod == 'true' &&
      (needs.apply-shared.result == 'success' || needs.apply-shared.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Terraform init
        uses: ./.github/actions/terraform-init
        id: init
        with:
          working_directory: terraform/envs/prod
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          needs_neon_secret: "true"
      - name: Apply
        run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.init.outputs.neon_api_key }}

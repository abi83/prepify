name: terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: terraform-ci@prepify-infra.iam.gserviceaccount.com

jobs:
  plan:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - run: terraform init
      - run: terraform fmt -check
      - run: terraform plan -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - run: terraform init
      - run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

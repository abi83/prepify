name: terraform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: terraform-ci@prepify-infra.iam.gserviceaccount.com

jobs:
  plan-shared:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/shared
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform plan -no-color

  plan-dev:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform plan -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

  plan-prod:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform fmt -check
      - run: terraform plan -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

  # Shared infra (Artifact Registry, WIF, CI identities) auto-applies on
  # merge, same as dev — it changes rarely and isn't environment data-plane.
  apply-shared:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/shared
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform apply -auto-approve -no-color

  # Dev auto-applies on merge — no gate, matches "dev is the thing you
  # break to find out" tier.
  apply-dev:
    if: github.event_name == 'push'
    needs: apply-shared
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

  # Prod requires manual approval — see the "prod" GitHub Environment's
  # required-reviewer protection rule (repo Settings > Environments).
  apply-prod:
    if: github.event_name == 'push'
    needs: apply-shared
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            neon_api_key:prepify-infra/neon-api-key
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - run: terraform init
      - run: terraform apply -auto-approve -no-color
        env:
          TF_VAR_neon_api_key: ${{ steps.secrets.outputs.neon_api_key }}

name: Issue Refinement & Estimation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
      phase:
        description: "Which phase to run"
        required: true
        type: choice
        options:
          - refine
          - estimate
      debug:
        description: "Show full Claude output in logs"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  id-token: write

env:
  # Bash permission matching is a literal prefix match on the command string
  # (not a resolved path), so each gh-safe script needs an entry for every
  # form the agent might type it in: relative with ./, relative without it,
  # and workspace-absolute.
  ALLOWED_EDIT_BODY: "Bash(./.github/scripts/gh-safe/edit-issue-body.sh:*),Bash(.github/scripts/gh-safe/edit-issue-body.sh:*),Bash(${{ github.workspace }}/.github/scripts/gh-safe/edit-issue-body.sh:*)"
  ALLOWED_EDIT_LABELS: "Bash(./.github/scripts/gh-safe/edit-issue-labels.sh:*),Bash(.github/scripts/gh-safe/edit-issue-labels.sh:*),Bash(${{ github.workspace }}/.github/scripts/gh-safe/edit-issue-labels.sh:*)"
  ALLOWED_COMMENT: "Bash(./.github/scripts/gh-safe/comment-issue.sh:*),Bash(.github/scripts/gh-safe/comment-issue.sh:*),Bash(${{ github.workspace }}/.github/scripts/gh-safe/comment-issue.sh:*)"

jobs:
  refine:
    if: >
      github.event.label.name == 'status:needs-refinement' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'refine')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: abi83/prepify.wiki
          path: wiki

      - name: Resolve issue
        id: issue
        uses: ./.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || github.event.inputs.issue_number }}

      - name: Preserve original body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          printf '<details><summary>Body before refinement</summary>\n\n%s\n\n</details>' "$ISSUE_BODY" \
            | gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body-file -

      - name: Run Claude refinement
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            Read .github/prompts/refine.md for the exact rewrite rules and
            apply them to the issue and comments above to produce a new
            body.

            Important: never pass issue body or comment text as a Bash
            command-line argument — multi-line markdown breaks shell
            quoting. Instead, use the Write tool to write text to a file
            first, then run the script with no arguments so it reads
            that file.

            If refine.md says to stop for clarification:
            1. Write your question to ./.issue-pipeline-comment.md
            2. Run ./.github/scripts/gh-safe/comment-issue.sh (no args)
            3. Swap labels:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:needs-refinement" --add-label "status:needs-attention"
            Then stop. Do not edit the body in this case.

            Otherwise, in order:
            1. Write the new body to ./.issue-pipeline-body.md
            2. Run ./.github/scripts/gh-safe/edit-issue-body.sh (no args)
            3. Swap labels:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:needs-refinement" --add-label "status:refined"

            Do nothing else — no other comments, no other edits.
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "Read,Grep,Glob,Write,${{ env.ALLOWED_EDIT_BODY }},${{ env.ALLOWED_EDIT_LABELS }},${{ env.ALLOWED_COMMENT }}"

      - name: Report run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_COST=$(jq -r '[.[] | select(.type=="result")][0].total_cost_usd // empty' "${{ steps.claude.outputs.execution_file }}" 2>/dev/null)
          COST="unknown"
          if [[ -n "$RAW_COST" ]]; then
            COST=$(printf '%.4f' "$RAW_COST")
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --body "Refinement [pipeline run]($RUN_URL) — cost: \$$COST"

      - name: Verify outcome
        if: success() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ steps.issue.outputs.number }}"
          LABELS=$(gh issue view "$NUM" --repo ${{ github.repository }} --json labels --jq '[.labels[].name] | join(",")')
          if [[ "$LABELS" != *"status:refined"* && "$LABELS" != *"status:needs-attention"* ]]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue edit "$NUM" --repo ${{ github.repository }} --add-label "status:needs-attention"
            gh issue comment "$NUM" --repo ${{ github.repository }} --body "Refinement run completed without leaving the issue in \`status:refined\` or \`status:needs-attention\` — likely stopped partway through. See the run: $RUN_URL"
          fi

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --add-label "status:needs-attention"
          gh issue comment "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --body "Automated refinement failed. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  estimate:
    if: >
      github.event.label.name == 'status:refined' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.phase == 'estimate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: abi83/prepify.wiki
          path: wiki

      - name: Resolve issue
        id: issue
        uses: ./.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || github.event.inputs.issue_number }}

      - name: Run Claude estimation
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug == 'true' }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            Read .github/prompts/estimate.md for the exact sizing rules and
            apply them to the refined issue and comments above.

            Important: never pass comment text as a Bash command-line
            argument — multi-line text breaks shell quoting. Instead, use
            the Write tool to write text to a file first, then run the
            script with no arguments so it reads that file.

            If estimate.md says to stop for clarification:
            1. Write your question to ./.issue-pipeline-comment.md
            2. Run ./.github/scripts/gh-safe/comment-issue.sh (no args)
            3. Swap labels:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:refined" --add-label "status:needs-attention"
            Then stop.

            Otherwise, in order:
            1. Write the estimate output (verbatim) to
               ./.issue-pipeline-comment.md
            2. Run ./.github/scripts/gh-safe/comment-issue.sh (no args)
            3. Add the size label matching your SIZE line (size:XS,
               size:S, size:M, size:L, or size:XL) and swap status:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:refined" --add-label "status:estimated" --add-label "size:<SIZE>"

            Do nothing else.
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "Read,Grep,Glob,Write,${{ env.ALLOWED_COMMENT }},${{ env.ALLOWED_EDIT_LABELS }}"

      - name: Report run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_COST=$(jq -r '[.[] | select(.type=="result")][0].total_cost_usd // empty' "${{ steps.claude.outputs.execution_file }}" 2>/dev/null)
          COST="unknown"
          if [[ -n "$RAW_COST" ]]; then
            COST=$(printf '%.4f' "$RAW_COST")
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --body "Estimation [pipeline run]($RUN_URL) — cost: \$$COST"

      - name: Verify outcome
        if: success() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM="${{ steps.issue.outputs.number }}"
          LABELS=$(gh issue view "$NUM" --repo ${{ github.repository }} --json labels --jq '[.labels[].name] | join(",")')
          if [[ "$LABELS" != *"status:estimated"* && "$LABELS" != *"status:needs-attention"* && "$LABELS" != *"status:ready"* ]]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue edit "$NUM" --repo ${{ github.repository }} --add-label "status:needs-attention"
            gh issue comment "$NUM" --repo ${{ github.repository }} --body "Estimation run completed without leaving the issue in \`status:estimated\`, \`status:ready\`, or \`status:needs-attention\` — likely stopped partway through. See the run: $RUN_URL"
          fi

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --add-label "status:needs-attention"
          gh issue comment "${{ steps.issue.outputs.number }}" --repo ${{ github.repository }} --body "Automated estimation failed. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

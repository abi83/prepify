name: Issue Refinement & Estimation

# Thin caller: owns the triggers, delegates all logic to the reusable core in
# abi83/interns, pinned to an exact tag.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: true
      phase:
        description: "Which phase to run"
        required: true
        type: choice
        options:
          - refine
          - estimate
      debug:
        description: "Show full Claude output in logs"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  id-token: write

jobs:
  pipeline:
    uses: abi83/interns/.github/workflows/issue-pipeline.yml@v0.1.0
    secrets: inherit
    with:
      issue_number: ${{ inputs.issue_number }}
      phase: ${{ inputs.phase }}
      debug: ${{ github.event_name == 'workflow_dispatch' && inputs.debug || false }}

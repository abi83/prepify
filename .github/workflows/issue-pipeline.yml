name: Issue Refinement & Estimation

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  id-token: write

jobs:
  refine:
    if: >
      github.event.label.name == 'status:needs-refinement' ||
      github.event.label.name == 'status:accepted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY:
            ${{ github.event.issue.body }}

            Read .github/prompts/refine.md for the exact rewrite rules and
            apply them to the issue above to produce a new body.

            Then, in order:
            1. Set the new body:
               ./.github/scripts/gh-safe/edit-issue-body.sh "<new body>"
            2. Swap labels:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:needs-refinement" --remove-label "status:accepted" --add-label "status:refined"

            Do nothing else — no comments, no other edits.
          claude_args: |
            --allowedTools "Bash(./.github/scripts/gh-safe/edit-issue-body.sh:*),Bash(./.github/scripts/gh-safe/edit-issue-labels.sh:*)"

  estimate:
    if: github.event.label.name == 'status:refined'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY:
            ${{ github.event.issue.body }}

            Read .github/prompts/estimate.md for the exact sizing rules and
            apply them to the refined issue above.

            Then, in order:
            1. Post the estimate output as a comment:
               ./.github/scripts/gh-safe/comment-issue.sh "<estimate output, verbatim>"
            2. Add the size label matching your SIZE line (size:XS,
               size:S, size:M, size:L, or size:XL) and swap status:
               ./.github/scripts/gh-safe/edit-issue-labels.sh --remove-label "status:refined" --add-label "status:estimated" --add-label "size:<SIZE>"

            Do nothing else.
          claude_args: |
            --allowedTools "Bash(./.github/scripts/gh-safe/comment-issue.sh:*),Bash(./.github/scripts/gh-safe/edit-issue-labels.sh:*)"

name: Lint pipeline

on:
  # No paths: filter — a required check must report on every PR, not sit pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installer script pinned to the v1.7.12 tag commit — it's curl|bash in CI.
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint workflows and their inline run blocks
        run: actionlint -color

      - name: Lint standalone shell scripts
        run: find .github/scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

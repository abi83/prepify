name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to redeploy to prod (rollback). Leave empty to deploy the current branch to dev instead."
        required: false
      run_checks:
        description: "Run CI checks before deploying"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Mirrors terraform/shared outputs — can't be wired automatically since
# Terraform hasn't run yet when this workflow starts. Keep in sync by hand.
#
# vars.GCP_PROJECT_ID is an environment-scoped Actions variable (repo
# Settings → Environments → dev / prod), not defined in this file — it
# resolves to prepify-dev-vk or prepify-prod based on each job's `environment:`.
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/780464996197/locations/global/workloadIdentityPools/github-actions/providers/github
  SERVICE_ACCOUNT: github-deploy@prepify-infra.iam.gserviceaccount.com
  REGISTRY: us-central1-docker.pkg.dev/prepify-infra/prepify
  IMAGE: prepify-nextjs
  REGION: us-central1

jobs:
  test:
    name: Test
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Audit
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Fails if prisma/schema.prisma changed without a matching migration file —
  # the actual gap that let #194 merge and deploy without one. Uses a
  # disposable Postgres service container as the shadow DB; never touches
  # the real (Neon) dev/prod databases.
  check-migrations:
    name: Check migrations
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prepify_migrate_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check schema.prisma has a matching migration
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/prepify_migrate_check
        run: |
          set +e
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema ./prisma/schema.prisma \
            --exit-code --script
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::error::prisma/schema.prisma has changes with no matching migration (diff above). Generate one against a disposable Postgres (see CLAUDE.md's Database Migrations section) and commit it."
            exit 1
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  gitleaks:
    name: Gitleaks
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        # gitleaks/gitleaks-action v3.0.0, pinned by commit digest
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The coding pipeline gates the reviewer on this and `test` both (#134).
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build

  # Fan-in gate — deploy jobs depend on this single job instead of repeating
  # five success/skipped conditions each. Runs unconditionally (if: always())
  # so it reports even when upstream jobs are skipped.
  ci:
    name: CI
    needs: [test, audit, lint, check-migrations, build, gitleaks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All checks passed
        run: |
          echo '${{ toJSON(needs) }}' \
            | jq -e '[.[].result] | all(. == "success" or . == "skipped")'

  # Dev version: synthetic timestamp+sha — no tag exists on main commits.
  # Prod version: the git tag itself (e.g. v1.2.3) — already meaningful, no job needed.
  resolve-dev-version:
    name: Resolve dev version
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: version
        run: echo "value=$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy to dev
    needs: [ci, resolve-dev-version]
    if: needs.ci.result == 'success' && needs.resolve-dev-version.result == 'success'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
      environment_url: https://prepify-529277275400.us-central1.run.app/
      image_tag: ${{ github.sha }}
      app_version: ${{ needs.resolve-dev-version.outputs.app_version }}
      build: true
      push_latest: false
    secrets: inherit

  # Gated by the "prod" environment's required-reviewer rule (GitHub settings, not visible here).
  deploy-prod:
    name: Deploy to prod
    needs: [ci]
    if: |
      needs.ci.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
      environment_url: http://prepify.cc/
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      app_version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      build: ${{ github.event_name != 'workflow_dispatch' }}
      push_latest: ${{ github.event_name != 'workflow_dispatch' }}
    secrets: inherit

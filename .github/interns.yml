# interns pipeline config -- only deliberate overrides; everything else follows
# interns' defaults. Reference: abi83/interns templates/config/defaults.yml
# Schema: abi83/interns/.github/interns.schema.json

debug: true

wiki:
  enabled: true
  url: abi83/prepify.wiki

agents:
  # Shrink an agent's list only once you've confirmed it needs the tool — this is a security ceiling, not a convenience knob.
  refiner:
    disallowed_tools:
      - Bash
      - Task
      - ScheduleWakeup
      - WebSearch
      - WebFetch
      - Write
      - Edit
      - NotebookEdit
  estimator:
    disallowed_tools:
      - Bash
      - Task
      - ScheduleWakeup
      - WebSearch
      - WebFetch
      - Write
      - Edit
      - NotebookEdit
  coder:
    max_turns: 100
    allowed_tools:
      - Bash(npx prisma migrate dev:*)
      - Bash(make lint:*)
      - Bash(npx prisma generate:*)
      - Bash(npx vitest run:*)
      - Bash(npx eslint:*)
    disallowed_tools:
      - Task
      - ScheduleWakeup
      - WebSearch
      - WebFetch
      - NotebookEdit
  reviewer:
    disallowed_tools:
      - Task
      - ScheduleWakeup
      - WebSearch
      - WebFetch
      - Write
      - Edit
      - NotebookEdit

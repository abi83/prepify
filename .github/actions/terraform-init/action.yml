name: terraform-init
description: Authenticate to GCP, optionally fetch the Neon API key, and run terraform init

inputs:
  working_directory:
    required: true
  workload_identity_provider:
    required: true
  service_account:
    required: true
  needs_neon_secret:
    required: false
    default: "false"

outputs:
  neon_api_key:
    description: Neon API key (only set when needs_neon_secret is "true")
    value: ${{ steps.secrets.outputs.neon_api_key }}

runs:
  using: composite
  steps:
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
    - name: Fetch Neon API key
      id: secrets
      if: inputs.needs_neon_secret == 'true'
      uses: google-github-actions/get-secretmanager-secrets@v2
      with:
        secrets: |-
          neon_api_key:prepify-infra/neon-api-key
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.*"
    - name: Terraform init
      run: terraform init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
